name: Release

# Work lands on dev; main is production, and Render deploys every main commit whose CI passes
# (render.yaml). This keeps one "Release: dev → main" PR open while dev is ahead: merging it
# is the deploy button. After main moves, dev is brought level with it again, so a squash-merged
# release or a hotfix straight to main doesn't leave the two branches diverged.
# docs/deployment.md ("Branches and releases").
#
# Needs the repository setting "Allow GitHub Actions to create and approve pull requests".
# Pushes and PRs made with GITHUB_TOKEN don't start other workflows, except workflow_dispatch:
# the release PR shows the CI run from the push to dev, and after sync-dev pushes to dev it
# dispatches CI and this workflow for the new head, so the release PR is never left unchecked.

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')"

          # The files decide, not the commits: after a squashed release, dev keeps commits main
          # never got, though their changes are on main.
          if git diff --quiet origin/main origin/dev; then
            echo 'dev matches main; nothing to release.'
            if [[ -n "$existing" ]]; then
              gh pr close "$existing" --comment 'dev now matches main: nothing left to release.'
            fi
            exit 0
          fi

          # Commits since the last release PR's head (already released, even if squashed) that
          # main doesn't have, merge commits aside (the syncs below).
          released="$(gh pr list --base main --head dev --state merged --limit 1 --json headRefOid --jq '.[0].headRefOid // empty')"
          exclude=()
          if [[ -n "$released" ]] && git cat-file -e "$released^{commit}" 2>/dev/null; then
            exclude=("^$released")
          fi
          commits="$(git log --no-merges --format='- %s' origin/main..origin/dev "${exclude[@]}")"
          [[ -n "$commits" ]] || commits='- (only merges: see the diff)'

          changed="$(git diff --name-only origin/main...origin/dev)"
          services=''
          if grep -q '^backend/' <<<"$changed"; then services="${services}- the API (rent-tracker-api)"$'\n'; fi
          if grep -qvE '^(backend|docs|google-api|whatsapp-bot)/' <<<"$changed"; then services="${services}- the app (rent-tracker)"$'\n'; fi
          [[ -n "$services" ]] || services=$'- nothing: no deployed code changed\n'

          body="$RUNNER_TEMP/release-pr.md"
          cat >"$body" <<EOF
          Merging this deploys to production: Render deploys main once CI passes on it.

          **Use "Create a merge commit"**, not squash, so dev and main keep the same history.

          ### What's in it
          ${commits}

          ### What deploys
          ${services}
          Check the migrations in \`backend/**/migrations/\` before merging: rolling back doesn't undo them (docs/deployment.md, "Rolling back").
          EOF

          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --body-file "$body"
            echo "Updated release PR #$existing"
          else
            gh pr create --base main --head dev --title 'Release: dev → main' --body-file "$body"
          fi

  sync-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      # After a merged release dev just fast-forwards; a squashed release or a hotfix needs a merge.
      - name: Merge main into dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'dev already has everything on main.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-edit -m 'Sync main into dev' origin/main; then
            echo '::error::main conflicts with dev: merge main into dev by hand and push.'
            exit 1
          fi
          git push origin HEAD:dev

          # That push started nothing (GITHUB_TOKEN), and dev has a new head: check it, and bring
          # the release PR up to date.
          gh workflow run ci.yml --ref dev
          gh workflow run release.yml --ref dev
