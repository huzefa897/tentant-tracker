name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  # Release workflow's sync-dev starts it for dev's new head (its own pushes start nothing).
  workflow_dispatch:

# A new push to the same branch cancels the run already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Known high or critical vulnerabilities in what ships to browsers fail the build.
      # Development tooling is left to Dependabot (docs/security.md).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: rent_tracker
          POSTGRES_USER: rent_tracker
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rent_tracker -d rent_tracker"
          --health-interval 5s --health-timeout 5s --health-retries 10
    # CI-only values; there is no .env here, so settings read these directly.
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: rent_tracker
      POSTGRES_USER: rent_tracker
      POSTGRES_PASSWORD: ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # Tests mock Firebase; no credentials in CI.
      FIREBASE_PROJECT_ID: ci-test-project
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pipenv
          cache-dependency-path: backend/Pipfile.lock

      - run: python -m pip install pipenv
      # --deploy fails if Pipfile.lock is out of date with Pipfile.
      - run: pipenv install --deploy --dev
      # Known vulnerabilities in the locked Python packages fail the build.
      - run: |
          pipenv requirements --hash > "$RUNNER_TEMP/requirements.txt"
          pipx run pip-audit --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      - run: pipenv run check
      # Production-like settings must pass Django's deployment checks (docs/security.md).
      - run: pipenv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SECRET_KEY: ci-deploy-check-only-not-a-real-secret-0123456789-abcdefghij
          DJANGO_SECURE_SSL_REDIRECT: 'True'
          DJANGO_SECURE_HSTS_SECONDS: '31536000'
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: 'True'
      # Fails if a model change has no migration.
      - run: pipenv run python manage.py makemigrations --check --dry-run
      - run: pipenv run test

  # Dry-run merges against the base and other open PRs' branches. Only a conflict with the
  # base fails; others are warnings on the PR. See scripts/check-merge-conflicts.sh.
  merge-conflicts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's own commits (not GitHub's merge commit) and every branch to compare with.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - run: >-
          scripts/check-merge-conflicts.sh --no-fetch
          --base "origin/${{ github.base_ref }}" --self "${{ github.head_ref }}"
        env:
          GH_TOKEN: ${{ github.token }}
