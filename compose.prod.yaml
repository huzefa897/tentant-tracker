# Production: Caddy (HTTPS, the Vue app) → Django (Gunicorn) → PostgreSQL, on one server.
# Settings come from .env.production (copy .env.production.example). Use the scripts, which
# pass it: scripts/deploy.sh, scripts/backup-db.sh, scripts/restore-test.sh (docs/deployment.md).
#   docker compose --env-file .env.production -f compose.prod.yaml <command>
#
# Only Caddy is published (80 and 443). PostgreSQL is on an internal network with no route out
# and no published port; only Django reaches it. Each service gets only the variables it needs.

name: rent-tracker

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
    volumes:
      # Survives restarts and redeploys. It is not a backup (scripts/backup-db.sh).
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Tagged per release (scripts/deploy.sh), so the previous image stays available to roll back.
    image: rent-tracker-backend:${RELEASE:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env.production}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set in .env.production}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?set in .env.production}
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:?set in .env.production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Behind Caddy, which ends HTTPS and adds the client's address.
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
      DJANGO_BEHIND_HTTPS_PROXY: "true"
      DJANGO_NUM_PROXIES: "1"
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-true}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      # Several Gunicorn workers share the rate-limit counts in PostgreSQL.
      DJANGO_SHARED_CACHE: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set in .env.production}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_service_account
    secrets:
      # Mounted read-only at run time; never copied into the image.
      - firebase_service_account
    # database: to reach PostgreSQL. default: to reach Caddy and, outbound, Firebase.
    networks: [database, default]

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?set in .env.production}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?set in .env.production}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?set in .env.production}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?set in .env.production}
    image: rent-tracker-web:${RELEASE:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set in .env.production}
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH}
      FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Caddy's certificates and keys: keep them, or Let's Encrypt limits can lock you out.
      - caddy_data:/data
      - caddy_config:/config
    networks: [default]

secrets:
  firebase_service_account:
    # A path outside the repository, readable by the container's user (docs/deployment.md).
    file: ${FIREBASE_SERVICE_ACCOUNT_FILE:?set in .env.production}

networks:
  database:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
