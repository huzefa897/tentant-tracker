# Render Blueprint: the app on Render's free plan, with the database on Supabase (free).
# docs/deployment.md ("Render and Supabase") walks through it; compose.prod.yaml is the
# single-server alternative.
#
#   browser ──▶ rent-tracker (static site: the built Vue app)
#          └──▶ rent-tracker-api (Docker: Django + Gunicorn) ──TLS──▶ Supabase PostgreSQL
#
# Two origins: the app calls the API's own URL (VITE_API_BASE_URL), which allows the app's
# origin through CORS. Values marked sync: false are asked for when the Blueprint is created
# and never kept in the repository. The onrender.com names below assume the services get the
# names they ask for: if Render adds a suffix, change every URL that mentions them.

services:
  - type: web
    name: rent-tracker-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Migrates, then starts Gunicorn on $PORT (backend/render-start.sh).
    dockerCommand: sh render-start.sh
    # The app alone, no database query: Render calls it every few seconds.
    healthCheckPath: /api/v1/health/
    # Deploy a commit only once CI has passed on it.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: PORT
        value: "8000"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # localhost: Render's own health checks are reported to send it as the Host.
      - key: DJANGO_ALLOWED_HOSTS
        value: rent-tracker-api.onrender.com,localhost
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://rent-tracker-api.onrender.com
      # Admin's path: something not obvious, ending in a slash.
      - key: DJANGO_ADMIN_PATH
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://rent-tracker.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_BEHIND_HTTPS_PROXY
        value: "true"
      # Render's proxies append to X-Forwarded-For; 3 is what users have measured, not a
      # documented figure. Check it before relying on per-address limits (docs/deployment.md).
      - key: DJANGO_NUM_PROXIES
        value: "3"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECURE_COOKIES
        value: "true"
      - key: DJANGO_SHARED_CACHE
        value: "true"
      # Room for Render's health checks every few seconds (counted in memory, no database).
      - key: DJANGO_THROTTLE_HEALTH
        value: 120/minute
      # Two workers fit the free instance's 512 MB.
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DJANGO_LOG_LEVEL
        value: INFO
      # Supabase: Connect > Session pooler (IPv4; the direct connection is IPv6-only on the
      # free plan). Not the transaction pooler on port 6543.
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: postgres
      # postgres.<project-ref>
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      # Firebase: the project and its service-account key's fields (backend/.env.example).
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false

  - type: web
    name: rent-tracker
    runtime: static
    # Dev dependencies too: the build needs Vite and vue-tsc.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - backend/**
        - docs/**
        - google-api/**
        - whatsapp-bot/**
    # Vue routes (/tenants/…) aren't files: they get index.html and the router takes over.
    # Render applies this only where no file exists, so built assets are served as they are.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # As deploy/web/Caddyfile. Hashed assets are cached for good; everything else is checked on
    # every visit, so a release shows up at once.
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      # Report-only until phone sign-in has been checked against it (docs/deployment.md).
      # Replace YOUR-PROJECT with the Firebase project's auth domain.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com https://apis.google.com; frame-src https://www.google.com https://YOUR-PROJECT.firebaseapp.com; connect-src 'self' https://rent-tracker-api.onrender.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: VITE_API_BASE_URL
        value: https://rent-tracker-api.onrender.com/api/v1
      # The Firebase web app's config (public; baked into the build).
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
